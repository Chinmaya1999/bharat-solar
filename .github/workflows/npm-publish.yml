name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Files
        run: |
          pwd
          ls -la
          find . -name "Dockerfile"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/mern-backend:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/mern-backend:${{ github.sha }} \
            backend

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mern-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mern-backend:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Stop and remove existing container
            docker stop mern-backend || true
            docker rm mern-backend || true
            
            # Pull the latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/mern-backend:latest
            
            # Run new container with all environment variables
            docker run -d \
              --name mern-backend \
              -p 3001:3001 \
              --restart unless-stopped \
              -e GMAIL_USER="${{ secrets.GMAIL_USER }}" \
              -e GMAIL_APP_PASSWORD="${{ secrets.GMAIL_APP_PASSWORD }}" \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e live_api_uri="http://localhost:3001" \
              ${{ secrets.DOCKER_USERNAME }}/mern-backend:latest
            
            # Clean up old images
            docker image prune -f
            
            # Verify container is running
            docker ps | grep mern-backend
            docker logs --tail 20 mern-backend
