name: Deploy Full Stack Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ========== DEBUG: LIST ALL DIRECTORIES ==========
      - name: List all directories
        run: |
          echo "=== All directories in repository ==="
          ls -la
          echo "=== Finding Dockerfiles ==="
          find . -name "Dockerfile"
          echo "=== Finding frontend related directories ==="
          find . -type d -iname "*frontend*" -o -type d -iname "*client*" -o -type d -iname "*ui*"

      # ========== BACKEND DEPLOYMENT ==========
      - name: Verify Backend Files
        run: |
          echo "=== Backend Files ==="
          ls -la backend/
          find . -name "Dockerfile" | grep backend

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Docker Image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/mern-backend:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/mern-backend:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/mern-backend:v1.${{ github.run_number }} \
            backend

      - name: Push Backend Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mern-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mern-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/mern-backend:v1.${{ github.run_number }}

      # ========== FRONTEND DEPLOYMENT ==========
      - name: Verify Frontend Files
        run: |
          echo "=== Frontend Files ==="
          if [ -d "Frontend" ]; then
            ls -la Frontend/
            find . -name "Dockerfile" | grep -i frontend
          elif [ -d "frontend" ]; then
            ls -la frontend/
            find . -name "Dockerfile" | grep frontend
          elif [ -d "client" ]; then
            ls -la client/
            find . -name "Dockerfile" | grep client
          else
            echo "No frontend directory found!"
            exit 1
          fi

      - name: Build Frontend Docker Image
        run: |
          # Use the correct directory name based on your structure
          if [ -d "Frontend" ]; then
            docker build \
              -f Frontend/Dockerfile \
              --build-arg VITE_API_URL=https://api.bharatsolarsolution.com \
              -t ${{ secrets.DOCKER_USERNAME }}/mern-frontend:latest \
              -t ${{ secrets.DOCKER_USERNAME }}/mern-frontend:${{ github.sha }} \
              -t ${{ secrets.DOCKER_USERNAME }}/mern-frontend:v1.${{ github.run_number }} \
              Frontend
          elif [ -d "frontend" ]; then
            docker build \
              -f frontend/Dockerfile \
              --build-arg VITE_API_URL=https://api.bharatsolarsolution.com \
              -t ${{ secrets.DOCKER_USERNAME }}/mern-frontend:latest \
              -t ${{ secrets.DOCKER_USERNAME }}/mern-frontend:${{ github.sha }} \
              -t ${{ secrets.DOCKER_USERNAME }}/mern-frontend:v1.${{ github.run_number }} \
              frontend
          elif [ -d "client" ]; then
            docker build \
              -f client/Dockerfile \
              --build-arg VITE_API_URL=https://api.bharatsolarsolution.com \
              -t ${{ secrets.DOCKER_USERNAME }}/mern-frontend:latest \
              -t ${{ secrets.DOCKER_USERNAME }}/mern-frontend:${{ github.sha }} \
              -t ${{ secrets.DOCKER_USERNAME }}/mern-frontend:v1.${{ github.run_number }} \
              client
          else
            echo "No frontend directory found!"
            exit 1
          fi

      - name: Push Frontend Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mern-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mern-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/mern-frontend:v1.${{ github.run_number }}

      # ========== DEPLOY BOTH TO EC2 ==========
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # ===== BACKEND DEPLOYMENT =====
            echo "=== Deploying Backend ==="
            
            # Pull the latest backend image
            echo "Pulling backend image: ${{ secrets.DOCKER_USERNAME }}/mern-backend:v1.${{ github.run_number }}"
            docker pull ${{ secrets.DOCKER_USERNAME }}/mern-backend:v1.${{ github.run_number }}
            
            # Stop and remove existing backend container
            docker stop mern-backend || true
            docker rm mern-backend || true
            
            # Remove the previous backend image (keep only the one we just pulled)
            echo "=== Removing previous backend images ==="
            docker images ${{ secrets.DOCKER_USERNAME }}/mern-backend --format "table {{.Repository}}:{{.Tag}} {{.ID}}" | grep -v "v1.${{ github.run_number }}" | grep -v "latest" | awk '{print $2}' | xargs -r docker rmi || true
            
            # Run new backend container with version tag
            docker run -d \
              --name mern-backend \
              -p 3001:3001 \
              --restart unless-stopped \
              -e GMAIL_USER="saiadityabehera@bharatsolarsolution.com" \
              -e GMAIL_APP_PASSWORD="gwvv gtks mulq puuq" \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e live_api_uri="https://api.bharatsolarsolution.com" \
              ${{ secrets.DOCKER_USERNAME }}/mern-backend:v1.${{ github.run_number }}
            
            # ===== FRONTEND DEPLOYMENT =====
            echo "=== Deploying Frontend ==="
            
            # Pull the latest frontend image
            echo "Pulling frontend image: ${{ secrets.DOCKER_USERNAME }}/mern-frontend:v1.${{ github.run_number }}"
            docker pull ${{ secrets.DOCKER_USERNAME }}/mern-frontend:v1.${{ github.run_number }}
            
            # Stop and remove existing frontend container
            docker stop mern-frontend || true
            docker rm mern-frontend || true
            
            # Remove the previous frontend image (keep only the one we just pulled)
            echo "=== Removing previous frontend images ==="
            docker images ${{ secrets.DOCKER_USERNAME }}/mern-frontend --format "table {{.Repository}}:{{.Tag}} {{.ID}}" | grep -v "v1.${{ github.run_number }}" | grep -v "latest" | awk '{print $2}' | xargs -r docker rmi || true
            
            # Run new frontend container on port 8080
            docker run -d \
              --name mern-frontend \
              -p 8080:80 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/mern-frontend:v1.${{ github.run_number }}
            
            # ===== CLEANUP AND VERIFICATION =====
            
            # Remove dangling images (none tagged)
            docker image prune -f
            
            # Tag the latest version for easy rollback
            docker tag ${{ secrets.DOCKER_USERNAME }}/mern-backend:v1.${{ github.run_number }} ${{ secrets.DOCKER_USERNAME }}/mern-backend:current || true
            docker tag ${{ secrets.DOCKER_USERNAME }}/mern-frontend:v1.${{ github.run_number }} ${{ secrets.DOCKER_USERNAME }}/mern-frontend:current || true
            
            # Show only the recent images (just pulled)
            echo "=== Recent Backend Images (Only latest) ==="
            docker images ${{ secrets.DOCKER_USERNAME }}/mern-backend --format "table {{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.CreatedAt}}" | head -5
            
            echo "=== Recent Frontend Images (Only latest) ==="
            docker images ${{ secrets.DOCKER_USERNAME }}/mern-frontend --format "table {{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.CreatedAt}}" | head -5
            
            # Verify both containers are running
            echo "=== Container Status ==="
            docker ps | grep mern-
            
            # Show which versions are running
            echo "=== Running Versions ==="
            echo "Backend version: v1.${{ github.run_number }}"
            echo "Frontend version: v1.${{ github.run_number }}"
            
            # Show backend logs
            echo "=== Backend Logs (last 20 lines) ==="
            docker logs --tail 20 mern-backend
            
            # Show frontend logs
            echo "=== Frontend Logs (last 20 lines) ==="
            docker logs --tail 20 mern-frontend
            
            # Health check for backend
            echo "=== Backend Health Check ==="
            sleep 5
            curl -f http://localhost:3001/health || echo "Backend health check failed"
            
            # Health check for frontend
            echo "=== Frontend Health Check ==="
            curl -f http://localhost:8080 || echo "Frontend health check failed"
